<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#193d5b" />
  <title>Offline — CBTKU SMP Negeri 11 PPU</title>
  <link rel="icon" href="/pwa-192.png" type="image/png" />
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d2d3e; background: #f4f7fa; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; padding: max(1.2rem, env(safe-area-inset-top)) 1rem max(1.2rem, env(safe-area-inset-bottom)); display: grid; place-items: center; }
    main { width: min(100%, 440px); padding: 2rem 1.4rem; text-align: center; border: 1px solid #e1e7ed; border-radius: 18px; background: #fff; box-shadow: 0 16px 50px rgba(24,47,68,.09); }
    img { width: 76px; height: 76px; object-fit: contain; padding: 5px; border: 1px solid #e1e7ed; border-radius: 14px; }
    h1 { margin: 1rem 0 .6rem; font-size: 1.35rem; }
    p { color: #62758a; line-height: 1.65; font-size: .95rem; }
    button { min-height: 46px; width: 100%; padding: .75rem 1rem; margin-top: .65rem; border: 0; border-radius: 9px; color: #fff; background: #193d5b; font: inherit; font-weight: 700; }
    .note { margin-top: 1rem; padding: .75rem; border-radius: 9px; background: #fff8e8; color: #825d16; font-size: .82rem; }
  </style>
</head>
<body>
  <main>
    <img src="/pwa-192.png" alt="Logo SMP Negeri 11 PPU" />
    <h1>CBTKU sedang offline</h1>
    <p>Periksa koneksi internet perangkat Anda, lalu muat ulang halaman untuk menggunakan portal ujian sekolah.</p>
    <div class="note">Ujian tidak dapat dikerjakan secara offline. Login, soal, penyimpanan jawaban, token pengawas, dan pengumpulan ujian memerlukan koneksi ke server.</div>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
